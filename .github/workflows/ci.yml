name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Describe package
        run: swift package describe

      - name: Build Debug
        run: >-
          swift build -c debug
          --explicit-target-dependency-import-check error
          -Xswiftc -warnings-as-errors

      - name: Run Swift Testing contracts
        run: >-
          swift test
          --explicit-target-dependency-import-check error
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Run exhaustive custom tests
        run: swift run codex-gauge-tests

      - name: Build Release
        run: >-
          swift build -c release
          --explicit-target-dependency-import-check error
          -Xswiftc -warnings-as-errors

      - name: Test release automation
        shell: bash
        run: |
          set -euo pipefail
          bash Tests/ReleasePackagingTests/test_release_packaging.sh
          bash Tests/ReleaseWorkflowTests/test_release_workflow.sh

      - name: Test Xcode unit target
        run: >-
          xcodebuild test
          -project CodexGauge.xcodeproj
          -scheme CodexGauge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/CodexGaugeDerivedData"
          -only-testing:CodexGaugeUnitTests
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Test Xcode UI smoke
        if: github.event_name != 'pull_request'
        run: >-
          xcodebuild test
          -project CodexGauge.xcodeproj
          -scheme CodexGauge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/CodexGaugeDerivedData"
          -only-testing:CodexGaugeUITests
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build and verify release disk image
        shell: bash
        run: |
          set -euo pipefail
          build_settings="$(xcodebuild \
            -project CodexGauge.xcodeproj \
            -target CodexGauge \
            -configuration Release \
            -showBuildSettings)"
          version="$(awk '$1 == "MARKETING_VERSION" { value = $3 } END { print value }' <<< "$build_settings")"
          build="$(awk '$1 == "CURRENT_PROJECT_VERSION" { value = $3 } END { print value }' <<< "$build_settings")"
          test -n "$version"
          test -n "$build"
          Scripts/build-release-dmg.sh \
            --output-directory "$RUNNER_TEMP/release" \
            --version "$version" \
            --build "$build"
