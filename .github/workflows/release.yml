name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_package:
    name: build-package
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      build: ${{ steps.metadata.outputs.build }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          build_settings="$(xcodebuild \
            -project CodexGauge.xcodeproj \
            -target CodexGauge \
            -configuration Release \
            -showBuildSettings)"
          version="$(awk '$1 == "MARKETING_VERSION" { value = $3 } END { print value }' <<< "$build_settings")"
          build="$(awk '$1 == "CURRENT_PROJECT_VERSION" { value = $3 } END { print value }' <<< "$build_settings")"
          test -n "$version"
          test -n "$build"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            Scripts/validate-release-context.sh \
              --tag "$GITHUB_REF_NAME" \
              --version "$version" \
              --build "$build" \
              --main-ref refs/remotes/origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "artifact_name=codex-gauge-$version-$build" >> "$GITHUB_OUTPUT"

      - name: Describe package
        run: swift package describe

      - name: Build Debug
        run: >-
          swift build -c debug
          --explicit-target-dependency-import-check error
          -Xswiftc -warnings-as-errors

      - name: Run Swift Testing contracts
        run: >-
          swift test
          --explicit-target-dependency-import-check error
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Run exhaustive custom tests
        run: swift run codex-gauge-tests

      - name: Build Release
        run: >-
          swift build -c release
          --explicit-target-dependency-import-check error
          -Xswiftc -warnings-as-errors

      - name: Test release contracts
        shell: bash
        run: |
          set -euo pipefail
          bash Tests/ReleasePackagingTests/test_release_packaging.sh
          bash Tests/ReleaseWorkflowTests/test_release_workflow.sh

      - name: Test Xcode unit target
        run: >-
          xcodebuild test
          -project CodexGauge.xcodeproj
          -scheme CodexGauge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/CodexGaugeReleaseTests"
          -only-testing:CodexGaugeUnitTests
          CODE_SIGNING_ALLOWED=NO

      - name: Test Xcode UI smoke
        run: >-
          xcodebuild test
          -project CodexGauge.xcodeproj
          -scheme CodexGauge
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/CodexGaugeReleaseTests"
          -only-testing:CodexGaugeUITests
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=

      - name: Build and verify release disk image
        run: >-
          Scripts/build-release-dmg.sh
          --output-directory "$RUNNER_TEMP/codex-gauge-release"
          --version "${{ steps.metadata.outputs.version }}"
          --build "${{ steps.metadata.outputs.build }}"

      - name: Add release review notes and verification scripts
        shell: bash
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/codex-gauge-release"
          cp .github/release-notes.md "$release_directory/release-notes.md"
          mkdir "$release_directory/verification"
          cp Scripts/verify-release-app.sh "$release_directory/verification/"
          cp Scripts/verify-release-dmg.sh "$release_directory/verification/"
          cp Scripts/verify-release-dmg-layout.applescript "$release_directory/verification/"

      - name: Upload verified release candidate
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/codex-gauge-release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false

  publish_draft:
    name: publish-draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build_package
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified release candidate
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build_package.outputs.artifact_name }}
          path: ${{ runner.temp }}/codex-gauge-release-candidate

      - name: Reverify release candidate
        shell: bash
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/codex-gauge-release-candidate"
          test "$(find "$release_directory" -type f | wc -l | tr -d '[:space:]')" = "6"
          test -f "$release_directory/CodexGauge.dmg"
          test -f "$release_directory/CodexGauge.dmg.sha256"
          test -f "$release_directory/release-notes.md"
          test -f "$release_directory/verification/verify-release-app.sh"
          test -f "$release_directory/verification/verify-release-dmg.sh"
          test -f "$release_directory/verification/verify-release-dmg-layout.applescript"
          chmod +x \
            "$release_directory/verification/verify-release-app.sh" \
            "$release_directory/verification/verify-release-dmg.sh"
          bash "$release_directory/verification/verify-release-dmg.sh" \
            --dmg "$release_directory/CodexGauge.dmg" \
            --checksum "$release_directory/CodexGauge.dmg.sha256" \
            --version "${{ needs.build_package.outputs.version }}" \
            --build "${{ needs.build_package.outputs.build }}"

      - name: Refuse an existing release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/codex-gauge-release-candidate"
          gh release create "$GITHUB_REF_NAME" \
            "$release_directory/CodexGauge.dmg#Codex Gauge macOS universal installer" \
            "$release_directory/CodexGauge.dmg.sha256#SHA-256 checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Codex Gauge ${{ needs.build_package.outputs.version }}" \
            --notes-file "$release_directory/release-notes.md"

      - name: Verify draft release
        shell: bash
        run: |
          set -euo pipefail
          draft="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)"
          assets="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets | map(.name) | sort | join(",")')"
          test "$draft" = "true"
          test "$assets" = "CodexGauge.dmg,CodexGauge.dmg.sha256"
